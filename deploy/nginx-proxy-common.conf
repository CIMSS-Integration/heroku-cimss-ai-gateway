# Shared proxy body for every server block that serves this app.
# Installed to /etc/nginx/sfchat-proxy-common.conf — deliberately NOT under
# conf.d/, because everything matching conf.d/*.conf is loaded as top-level http
# config and these directives are only valid inside a location.
#
# WHY THIS FILE EXISTS
# --------------------
# `proxy_read_timeout` and friends are per-location and are NOT inherited across
# server blocks. When TLS was added, the obvious mistake was to write a new :443
# server block and leave these behind — nginx would then silently apply its 60s
# default, capping generations at 60s and undoing the entire reason this app was
# moved off Heroku. There would be no error; long prompts would just start
# failing.
#
# Keeping the body in one included file makes that divergence impossible: the
# http and https paths are the same bytes. If you add a third server block, add
# the include, not a copy.
#
# The timeout contract this participates in:
#   proxy_read_timeout (600s, here)
#     > GENERATION_TIMEOUT_MS (540s, config/models.ts)
#       > the actual model call
# The app must always lose the race to itself, so a timeout surfaces as JSON
# rather than an nginx HTML error page. Raise this before raising the app's value.

proxy_pass         http://sfchat;
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# $scheme is what makes this correct in both blocks: "http" on :80, "https" on
# :443. Clerk production instances reject requests that look like plain http, so
# this header is load-bearing once pk_live is in use.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Matches `proxyClientMaxBodySize` in next.config.ts (30mb), itself set just above
# MAX_UPLOAD_BYTES (25MB, config/attachments.ts) so an oversized upload trips the
# app's own size check and gets a clear message instead of being truncated.
client_max_body_size 30m;
client_body_timeout  120s;

# The long-generation budget. See the header comment before changing.
proxy_connect_timeout 15s;
proxy_send_timeout    600s;
proxy_read_timeout    600s;

# Hand bytes to the client as they arrive rather than accumulating the whole
# reply: keeps nginx memory flat on long replies, and leaves this proxy correct
# if the app ever adopts token streaming.
proxy_buffering off;
proxy_request_buffering off;
