# nginx front end for the Salesforce Models API chat app.
# Installed to /etc/nginx/conf.d/sfchat.conf (included from inside nginx.conf's
# `http {}` block, so `map` and `upstream` are legal here).
#
# Three server blocks, in the order nginx matches them:
#   1. :443 ai.themimit.com  — the real entry point, TLS terminated here
#   2. :80  ai.themimit.com  — ACME challenge path + 301 to https
#   3. :80  default_server   — anything else (bare IP, stray Host headers)
#
# The proxy body lives in /etc/nginx/sfchat-proxy-common.conf and is included by
# every block that serves the app, so the 600s timeout contract cannot drift
# between the http and https paths. Read that file before changing timeouts.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream sfchat {
    # The app binds loopback only (see sfchat.service), so it is unreachable from
    # outside the box regardless of what the security group allows.
    server 127.0.0.1:3000;
}

# ---------------------------------------------------------------------------
# 1. The production host, over TLS.
# ---------------------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name ai.themimit.com;

    # Issued by Let's Encrypt. First cert was obtained with a manual DNS-01
    # challenge while this name still pointed at Heroku, so that TLS was already
    # live the moment DNS moved — there was never an unencrypted window. Renewal
    # was then converted to HTTP-01 (see the :80 block below), because
    # `--manual` cannot renew unattended.
    ssl_certificate     /etc/letsencrypt/live/ai.themimit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.themimit.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/ai.themimit.com/chain.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    access_log /var/log/nginx/sfchat.access.log;
    error_log  /var/log/nginx/sfchat.error.log;

    # HSTS is deliberately NOT set yet. Add it only once unattended renewal has
    # been proven (`certbot renew --dry-run`), because it is hard to walk back:
    # browsers will refuse plain http for this host for the max-age duration.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        include /etc/nginx/sfchat-proxy-common.conf;
    }
}

# ---------------------------------------------------------------------------
# 2. The production host, plain http: ACME + redirect. No app traffic.
# ---------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name ai.themimit.com;

    # Must stay reachable over plain http for unattended renewal. Keep this
    # above the redirect, or certbot's HTTP-01 validation will follow a 301 and
    # fail.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# 3. Everything else — bare IP, scanners, stray Host headers.
# ---------------------------------------------------------------------------
# Sends them to the canonical https host rather than serving the app over plain
# http. Note this is a redirect, not a TLS endpoint: the certificate only covers
# ai.themimit.com, so browsing to https://54.175.93.133 will warn about a name
# mismatch. That is expected and not worth a second certificate — for admin
# checks against the box directly, use:
#
#   curl --resolve ai.themimit.com:443:54.175.93.133 https://ai.themimit.com/
#
# nginx.conf ships its own `server { listen 80; server_name _; }` serving
# /usr/share/nginx/html. Ours claims `default_server`, so it wins and the stock
# block goes unused. nginx.conf is left untouched.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://ai.themimit.com$request_uri;
    }
}
